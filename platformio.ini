; PlatformIO Project Configuration File
; DualVend - Vending Machine Architecture
; Placa de desarrollo: Arduino Uno (ATmega328P)

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Velocidad del monitor serie
monitor_speed = 115200

; Dependencias de librerías
; LiquidCrystal_I2C (PCF8574 en 0x27) compatible con Wokwi y pantallas LCD I2C estándar
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    Wire

; Flags de compilación estándar
build_flags = 
    -Wall
    -Wextra
