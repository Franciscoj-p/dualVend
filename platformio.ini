; PlatformIO Project Configuration File
; DualVend - Vending Machine Architecture
; Placa de desarrollo: Arduino Uno (ATmega328P)

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Velocidad del monitor serie
monitor_speed = 115200

; Dependencias de librerías
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    chris--a/Keypad @ ^3.1.1
    Wire

; Flags de compilación estándar
build_flags = 
    -Wall
    -Wextra
